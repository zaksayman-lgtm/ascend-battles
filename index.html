<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ascend Battles</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #0b0e11; color: #ffffff; padding: 16px; max-width: 480px; margin: 0 auto; }
        
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .logo { font-weight: 900; font-size: 20px; color: #ffffff; letter-spacing: 0.5px; }
        .logo span { color: #00e676; }
        .connect-btn { background: #0b3d2e; border: 1px solid #00e676; color: #00e676; padding: 8px 16px; border-radius: 8px; font-weight: 600; font-size: 14px; cursor: pointer; transition: 0.2s; }
        .connect-btn.connected { background: rgba(0, 230, 118, 0.1); color: #00e676; border-color: #00e676; }
        
        .notice-card { background: #13171d; border: 1px solid #1e242d; border-radius: 12px; padding: 16px; margin-bottom: 16px; }
        .notice-card p { color: #9aa4b2; font-size: 13px; line-height: 1.4; }
        
        .airdrop-card { background: #13171d; border: 1px solid #1e242d; border-radius: 12px; padding: 16px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
        .airdrop-info h3 { font-size: 16px; font-weight: 700; margin-bottom: 4px; }
        .airdrop-info p { color: #00e676; font-size: 13px; font-weight: 600; }
        .claim-btn { background: #00e676; color: #000000; font-weight: 700; padding: 10px 20px; border-radius: 8px; border: none; cursor: pointer; font-size: 14px; }
        .claim-btn:disabled { background: #1f2630; color: #6b7785; cursor: not-allowed; }
        
        .portfolio-card { background: #13171d; border: 1px solid #1e242d; border-radius: 12px; padding: 16px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
        .portfolio-title { color: #6b7785; font-size: 11px; font-weight: 700; letter-spacing: 0.5px; margin-bottom: 4px; }
        .portfolio-value { font-size: 24px; font-weight: 800; color: #ffffff; }
        .earn-btn { background: #1f2630; color: #ffffff; border: none; padding: 8px 16px; border-radius: 8px; font-weight: 600; font-size: 13px; cursor: pointer; }
        
        .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
        .section-title { font-size: 16px; font-weight: 700; }
        .badge { background: #13171d; border: 1px solid #1e242d; color: #6b7785; font-size: 12px; padding: 4px 8px; border-radius: 6px; font-weight: 600; }
        
        .battle-card { background: #13171d; border: 1px solid #1e242d; border-radius: 12px; padding: 16px; margin-bottom: 16px; }
        .battle-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
        .tag { background: rgba(0, 230, 118, 0.1); color: #00e676; font-size: 10px; font-weight: 700; padding: 4px 8px; border-radius: 4px; }
        .timer { background: rgba(255, 179, 0, 0.1); color: #ffb300; font-size: 11px; font-weight: 700; padding: 4px 8px; border-radius: 4px; }
        
        .competitor { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .comp-info { display: flex; align-items: center; gap: 12px; }
        .icon { width: 36px; height: 36px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 12px; background: #ffb300; color: #000; }
        .comp-name { font-weight: 700; font-size: 15px; }
        .odds-btn { background: #ffb300; color: #000000; font-weight: 800; border: none; padding: 8px 18px; border-radius: 18px; font-size: 14px; min-width: 70px; cursor: pointer; }
        .odds-btn:hover { opacity: 0.9; }
        
        .battle-footer { display: flex; justify-content: space-between; margin-top: 16px; font-size: 12px; color: #6b7785; border-top: 1px solid #1a2027; padding-top: 12px; }
        .sponsor span { color: #00e676; font-weight: 600; }
        .predictors span { color: #ffffff; font-weight: 600; }
        
        .loading-arenas { text-align: center; color: #6b7785; padding: 20px; font-size: 13px; }
        .footer-text { text-align: center; color: #6b7785; font-size: 12px; margin-top: 24px; margin-bottom: 12px; }
    </style>
</head>
<body>

    <div class="header">
        <div class="logo">ASCEND<span>BATTLES</span></div>
        <button class="connect-btn" id="connectWalletBtn" onclick="toggleWallet()">Connect Wallet</button>
    </div>

    <div class="notice-card">
        <p>Ascend Battles uses free <strong>XP</strong> for prediction trading. No real funds are involved.</p>
    </div>

    <div class="airdrop-card" id="airdropCard">
        <div class="airdrop-info">
            <h3>Welcome Airdrop</h3>
            <p>Claim +200 XP instantly</p>
        </div>
        <button class="claim-btn" id="claimBtn" onclick="claimAirdrop()">Claim Now</button>
    </div>

    <div class="portfolio-card">
        <div>
            <div class="portfolio-title">PORTFOLIO XP BALANCE</div>
            <div class="portfolio-value" id="xpBalance">0 XP</div>
        </div>
        <button class="earn-btn" onclick="alert('Participate in live PvP battle arenas below to earn more XP!')">Earn XP</button>
    </div>

    <div class="section-header">
        <div class="section-title">Live 1v1 PvP Battles</div>
        <div class="badge">Elysium Testnet 99801</div>
    </div>

    <div id="arenasContainer">
        <div class="loading-arenas">Connecting to live backend arenas...</div>
    </div>

    <div class="footer-text">
        Ready for prediction trading on Elysium Testnet
    </div>

    <script>
        let userXP = 0;
        let isConnected = false;
        let airdropClaimed = false;

        function toggleWallet() {
            const btn = document.getElementById('connectWalletBtn');
            isConnected = !isConnected;
            if (isConnected) {
                btn.innerText = "0x48f...29a1";
                btn.classList.add('connected');
            } else {
                btn.innerText = "Connect Wallet";
                btn.classList.remove('connected');
            }
        }

        function claimAirdrop() {
            if (airdropClaimed) return;
            userXP += 200;
            airdropClaimed = true;
            document.getElementById('xpBalance').innerText = userXP + " XP";
            const claimBtn = document.getElementById('claimBtn');
            claimBtn.innerText = "Claimed";
            claimBtn.disabled = true;
        }

        async function loadArenas() {
            const container = document.getElementById('arenasContainer');
            try {
                // Change this URL to your Render backend link once live
                const response = await fetch('https://ascend-battles-api.onrender.com/api/arenas');
                const arenas = await response.json();
                
                container.innerHTML = '';
                arenas.forEach(arena => {
                    const card = document.createElement('div');
                    card.className = 'battle-card';
                    card.innerHTML = `
                        <div class="battle-meta">
                            <span class="tag">${arena.category}</span>
                            <span class="timer">${arena.timer}</span>
                        </div>
                        <div class="competitor">
                            <div class="comp-info">
                                <div class="icon">${arena.competitorA.code}</div>
                                <div class="comp-name">${arena.competitorA.name}</div>
                            </div>
                            <button class="odds-btn" onclick="placePrediction('${arena.competitorA.name}', ${arena.competitorA.odds})">${arena.competitorA.odds}x</button>
                        </div>
                        <div class="competitor">
                            <div class="comp-info">
                                <div class="icon" style="background: #29b6f6;">${arena.competitorB.code}</div>
                                <div class="comp-name">${arena.competitorB.name}</div>
                            </div>
                            <button class="odds-btn" style="background: #29b6f6;" onclick="placePrediction('${arena.competitorB.name}', ${arena.competitorB.odds})">${arena.competitorB.odds}x</button>
                        </div>
                        <div class="battle-footer">
                            <div class="sponsor">Sponsor Pool: <span>${arena.sponsorPool}</span></div>
                            <div class="predictors">Predictors: <span>${arena.predictors} Players</span></div>
                        </div>
                    `;
                    container.appendChild(card);
                });
            } catch (err) {
                // Fallback static data if backend is offline so the UI never breaks
                container.innerHTML = `
                    <div class="battle-card">
                        <div class="battle-meta">
                            <span class="tag">GAMEFI vs GAMEFI</span>
                            <span class="timer">Closes in 04h 22m</span>
                        </div>
                        <div class="competitor">
                            <div class="comp-info">
                                <div class="icon">CS</div>
                                <div class="comp-name">Cyber Samurai</div>
                            </div>
                            <button class="odds-btn" onclick="placePrediction('Cyber Samurai', 1.85)">1.85x</button>
                        </div>
                        <div class="competitor">
                            <div class="comp-info">
                                <div class="icon" style="background: #29b6f6;">MR</div>
                                <div class="comp-name">Mecha Ronin</div>
                            </div>
                            <button class="odds-btn" style="background: #29b6f6;" onclick="placePrediction('Mecha Ronin', 2.15)">2.15x</button>
                        </div>
                        <div class="battle-footer">
                            <div class="sponsor">Sponsor Pool: <span>$50.00 USDC</span></div>
                            <div class="predictors">Predictors: <span>142 Players</span></div>
                        </div>
                    </div>
                `;
            }
        }

        function placePrediction(fighter, odds) {
            if (!airdropClaimed && userXP === 0) {
                alert("Claim your Welcome Airdrop or earn XP before placing predictions!");
                return;
            }
            alert(`Prediction placed on ${fighter} at ${odds} odds!`);
        }

        loadArenas();
    </script>
</body>
</html>
