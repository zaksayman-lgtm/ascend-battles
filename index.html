<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ascend Battles</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #0b0e11; color: #ffffff; padding: 16px; }

        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .logo { font-weight: 900; font-size: 20px; color: #fff; }
        .logo span { color: #00e676; }
        .connect-btn { background: #0b3d2e; border: 1px solid #00e676; color: #00e676; padding: 8px 14px; border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 13px; }
        .connect-btn.connected { background: rgba(0, 230, 118, 0.15); }

        .notice-card { background: #13171d; border: 1px solid #1f2630; border-radius: 10px; padding: 12px; margin-bottom: 16px; }
        .notice-card p { color: #9aa4b2; font-size: 13px; line-height: 1.4; }

        .airdrop-card { background: #13171d; border: 1px solid #1f2630; border-radius: 12px; padding: 16px; margin-bottom: 16px; display: flex; justify-content: space-between; align-items: center; }
        .airdrop-info h3 { font-size: 16px; font-weight: 700; margin-bottom: 4px; }
        .airdrop-info p { color: #00e676; font-size: 13px; font-weight: 600; }
        .claim-btn { background: #00e676; color: #000000; border: none; padding: 10px 18px; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 13px; }
        .claim-btn:disabled { background: #1f2630; color: #6b7785; cursor: not-allowed; }

        .portfolio-card { background: #13171d; border: 1px solid #1f2630; border-radius: 12px; padding: 16px; margin-bottom: 24px; display: flex; justify-content: space-between; align-items: center; }
        .portfolio-title { color: #6b7785; font-size: 12px; font-weight: 600; text-transform: uppercase; margin-bottom: 4px; }
        .portfolio-value { font-size: 24px; font-weight: 800; color: #ffffff; }
        .earn-btn { background: #1f2630; color: #ffffff; border: 1px solid #2d3748; padding: 8px 14px; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; }

        .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .section-title { font-size: 16px; font-weight: 700; }
        .badge { background: #19202b; color: #6b7785; font-size: 11px; padding: 4px 8px; border-radius: 6px; border: 1px solid #1f2630; }

        .battle-card { background: #13171d; border: 1px solid #1f2630; border-radius: 12px; padding: 16px; margin-bottom: 16px; }
        .battle-meta { display: flex; justify-content: space-between; font-size: 11px; margin-bottom: 12px; }
        .tag { color: #00e676; background: rgba(0, 230, 118, 0.1); padding: 2px 6px; border-radius: 4px; font-weight: 700; }
        .timer { color: #ffb74d; }

        .competitor { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .comp-info { display: flex; align-items: center; gap: 8px; }
        .icon { width: 28px; height: 28px; border-radius: 50%; background: #ffb703; color: #000; font-weight: 800; display: flex; align-items: center; justify-content: center; font-size: 11px; }
        .comp-name { font-weight: 700; font-size: 14px; }
        .odds-btn { background: #ffb703; color: #000; border: none; padding: 6px 14px; border-radius: 16px; font-weight: 800; font-size: 12px; cursor: pointer; }

        .battle-footer { display: flex; justify-content: space-between; font-size: 11px; color: #6b7785; border-top: 1px solid #1f2630; pt: 10px; margin-top: 10px; padding-top: 10px; }
        .sponsor span { color: #00e676; font-weight: 600; }
        .predictors span { color: #ffffff; font-weight: 600; }

        .loading-text { text-align: center; color: #6b7785; font-size: 13px; padding: 20px; }
    </style>
</head>
<body>

    <div class="header">
        <div class="logo">ASCEND<span>BATTLES</span></div>
        <button id="connectBtn" class="connect-btn" onclick="connectWallet()">Connect Wallet</button>
    </div>

    <div class="notice-card">
        <p>Ascend Battles uses free <strong>XP</strong> for prediction trading. No real funds are involved.</p>
    </div>

    <div class="airdrop-card">
        <div class="airdrop-info">
            <h3>Welcome Airdrop</h3>
            <p>Claim +200 XP instantly</p>
        </div>
        <button id="claimBtn" class="claim-btn" onclick="claimAirdrop()">Claim Now</button>
    </div>

    <div class="portfolio-card">
        <div>
            <div class="portfolio-title">Portfolio XP Balance</div>
            <div id="portfolioValue" class="portfolio-value">0 XP</div>
        </div>
        <button class="earn-btn">Earn XP</button>
    </div>

    <div class="section-header">
        <div class="section-title">Live 1v1 PvP Battles</div>
        <div class="badge">Elysium Testnet 99801</div>
    </div>

    <div id="arenasContainer">
        <div class="loading-text">Fetching live arenas from backend...</div>
    </div>

    <script>
        let currentXP = 0;
        let connectedAccount = null;
        const BACKEND_URL = 'https://ascend-battles-2.onrender.com';

        // 1. Real Web3 Wallet Connection Logic
        async function connectWallet() {
            const btn = document.getElementById('connectBtn');
            if (typeof window.ethereum !== 'undefined') {
                try {
                    const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
                    connectedAccount = accounts[0];
                    const shortAddr = connectedAccount.substring(0, 6) + '...' + connectedAccount.substring(connectedAccount.length - 4);
                    btn.innerText = shortAddr;
                    btn.classList.add('connected');
                } catch (err) {
                    alert('Wallet connection rejected or failed: ' + err.message);
                }
            } else {
                alert('No Web3 wallet detected. Please open this page inside MetaMask Browser, Trust Wallet, or install the MetaMask extension.');
            }
        }

        // Handle Account Changes dynamically
        if (typeof window.ethereum !== 'undefined') {
            window.ethereum.on('accountsChanged', (accounts) => {
                const btn = document.getElementById('connectBtn');
                if (accounts.length > 0) {
                    connectedAccount = accounts[0];
                    btn.innerText = connectedAccount.substring(0, 6) + '...' + connectedAccount.substring(connectedAccount.length - 4);
                    btn.classList.add('connected');
                } else {
                    connectedAccount = null;
                    btn.innerText = 'Connect Wallet';
                    btn.classList.remove('connected');
                }
            });
        }

        // 2. Claim Airdrop State Update
        function claimAirdrop() {
            if (!connectedAccount) {
                alert('Please connect your Web3 wallet first!');
                return;
            }
            currentXP += 200;
            document.getElementById('portfolioValue').innerText = currentXP + ' XP';
            const claimBtn = document.getElementById('claimBtn');
            claimBtn.innerText = 'Claimed';
            claimBtn.disabled = true;
        }

        // 3. Load Arenas directly from Render Backend API
        async function loadArenas() {
            const container = document.getElementById('arenasContainer');
            try {
                const response = await fetch(`${BACKEND_URL}/api/arenas`);
                if (!response.ok) throw new Error(`HTTP Error: ${response.status}`);
                
                const arenas = await response.json();
                container.innerHTML = '';

                arenas.forEach(arena => {
                    const card = document.createElement('div');
                    card.className = 'battle-card';
                    card.innerHTML = `
                        <div class="battle-meta">
                            <span class="tag">${arena.category}</span>
                            <span class="timer">${arena.timer}</span>
                        </div>
                        <div class="competitor">
                            <div class="comp-info">
                                <div class="icon">${arena.competitorA.code}</div>
                                <div class="comp-name">${arena.competitorA.name}</div>
                            </div>
                            <button class="odds-btn" onclick="placePrediction(${arena.id}, '${arena.competitorA.name}')">${arena.competitorA.odds}x</button>
                        </div>
                        <div class="competitor">
                            <div class="comp-info">
                                <div class="icon" style="background: #29b6f6; color: #fff;">${arena.competitorB.code}</div>
                                <div class="comp-name">${arena.competitorB.name}</div>
                            </div>
                            <button class="odds-btn" style="background: #29b6f6; color: #fff;" onclick="placePrediction(${arena.id}, '${arena.competitorB.name}')">${arena.competitorB.odds}x</button>
                        </div>
                        <div class="battle-footer">
                            <div class="sponsor">Sponsor Pool: <span>${arena.sponsorPool}</span></div>
                            <div class="predictors">Predictors: <span>${arena.predictors} Players</span></div>
                        </div>
                    `;
                    container.appendChild(card);
                });
            } catch (err) {
                container.innerHTML = `<div class="loading-text" style="color: #ff5252;">Failed to load live backend data. Error: ${err.message}</div>`;
            }
        }

        function placePrediction(arenaId, competitor) {
            if (!connectedAccount) {
                alert('Please connect your Web3 wallet to place a prediction.');
                return;
            }
            if (currentXP < 10) {
                alert('You need at least 10 XP to place a prediction! Claim your welcome airdrop first.');
                return;
            }
            currentXP -= 10;
            document.getElementById('portfolioValue').innerText = currentXP + ' XP';
            alert(`Prediction placed on ${competitor}! 10 XP deducted.`);
        }

        // Initialize API call on page load
        loadArenas();
    </script>
</body>
</html>
