<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>frontend</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  <script>
  async function connectWallet() {
    if (typeof window.ethereum === "undefined") {
      alert("MetaMask not detected! Please open this app inside the MetaMask mobile browser.");
      return;
    }
    try {
      const accounts = await window.ethereum.request({ method: "eth_requestAccounts" });
      const account = accounts[0];
      
      // Auto-switch/add Elysium Network (Chain ID: 1339 / 0x53B)
      try {
        await window.ethereum.request({
          method: "wallet_switchEthereumChain",
          params: [{ chainId: "0x53B" }],
        });
      } catch (switchError) {
        if (switchError.code === 4902) {
          await window.ethereum.request({
            method: "wallet_addEthereumChain",
            params: [{
              chainId: "0x53B",
              chainName: "Elysium Mainnet",
              nativeCurrency: { name: "LAVA", symbol: "LAVA", decimals: 18 },
              rpcUrls: ["https://rpc.elysiumchain.tech"],
              blockExplorerUrls: ["https://explorer.elysiumchain.tech"]
            }],
          });
        }
      }
      
      // Update UI button with connected address
      const btn = document.querySelector("[data-wallet-btn]") || document.getElementById("connectBtn") || document.querySelector("button");
      if (btn) {
        btn.innerText = account.substring(0, 6) + "..." + account.substring(account.length - 4);
      }
    } catch (err) {
      console.error("Wallet connection failed:", err);
    }
  }
  </script>
</body>
</html>
